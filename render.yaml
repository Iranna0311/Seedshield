services:
  - type: web
    name: seedshield-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SEEDSHIELD_DEMO_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
